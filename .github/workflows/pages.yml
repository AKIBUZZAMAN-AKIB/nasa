name: Deploy to GitHub Pages

# Manual only: the team deploys the demo when it chooses to (Actions tab ->
# Deploy to GitHub Pages -> Run workflow). Enable Pages with the "GitHub
# Actions" source first. Nothing deploys automatically on a push to main.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint, checks and tests
        run: |
          npm run lint
          npm run check
          npx vitest run
      - name: Build for /${{ github.event.repository.name }}
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      - name: Single-page fallback and no Jekyll
        run: |
          touch build/.nojekyll
          cp build/index.html build/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
