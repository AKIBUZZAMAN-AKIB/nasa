<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0b1f4b" />
		<meta
			name="description"
			content="Find what changes. Understand what matters. Trend, change point, significance and reliability for NASA Earth observation data across five Earth systems, explained for researchers and everyone else. By team DIVERGENT, NASA Space Apps Challenge 2026."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Earth System Trend Explorer by DIVERGENT" />
		<meta property="og:title" content="Earth System Trend Explorer by DIVERGENT" />
		<meta
			property="og:description"
			content="Find what changes. Understand what matters. Evidence-based trends from NASA Earth data: what is changing, where, how much, when, and how sure we are."
		/>
		<meta property="og:image" content="https://akibuzzaman-akib.github.io/nasa/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Earth System Trend Explorer by DIVERGENT" />
		<meta
			name="twitter:description"
			content="Find what changes. Understand what matters. Evidence-based trends from NASA Earth data."
		/>
		<meta name="twitter:image" content="https://akibuzzaman-akib.github.io/nasa/og-image.png" />
		<script>
			// Hide the first-visit tour before the first paint when it is not needed
			// (a shared link, or a visitor who already closed it), so the page never jumps.
			try {
				if (location.search || localStorage.getItem('trend-intro-dismissed') === '1')
					document.documentElement.classList.add('intro-done');
			} catch (e) {
				document.documentElement.classList.add('intro-done');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
